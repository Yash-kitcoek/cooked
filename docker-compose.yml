services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: ./api/api/.env
    environment:
      POSTGRES_USER: complaints
      POSTGRES_PASSWORD: complaints-local-password
      POSTGRES_DB: complaints
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api/api
    env_file: ./api/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://complaints:complaints-local-password@postgres:5432/complaints
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./api/api
    env_file: ./api/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://complaints:complaints-local-password@postgres:5432/complaints
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    command: python -m app.worker

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads: